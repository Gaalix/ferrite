name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-ubuntu:
    name: Build Ubuntu Packages (.deb & .tar.gz)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            pkg-config \
            dpkg-dev \
            libmpv-dev \
            libwayland-dev \
            libvulkan-dev \
            libegl-dev \
            libfreetype-dev \
            libfontconfig-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release binary and Ubuntu packages
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          cargo build --release -p ferrite
          FERRITE_VERSION="${VERSION}" ./scripts/build-deb.sh

          TAR_STAGE="$(mktemp -d)"
          mkdir -p "${TAR_STAGE}/ferrite-linux-x86_64"
          install -Dm755 target/release/ferrite "${TAR_STAGE}/ferrite-linux-x86_64/ferrite"
          install -Dm755 scripts/install-ubuntu.sh "${TAR_STAGE}/ferrite-linux-x86_64/scripts/install-ubuntu.sh"
          install -Dm644 packaging/linux/ferrite.desktop "${TAR_STAGE}/ferrite-linux-x86_64/packaging/linux/ferrite.desktop"
          mkdir -p "${TAR_STAGE}/ferrite-linux-x86_64/assets/icons"
          cp -a assets/icons/. "${TAR_STAGE}/ferrite-linux-x86_64/assets/icons/"
          install -Dm644 LICENSE "${TAR_STAGE}/ferrite-linux-x86_64/LICENSE"
          install -Dm644 THIRD_PARTY_NOTICES.md "${TAR_STAGE}/ferrite-linux-x86_64/THIRD_PARTY_NOTICES.md"

          tar -C "${TAR_STAGE}" -czf dist/ferrite-linux-x86_64.tar.gz ferrite-linux-x86_64
          rm -rf "${TAR_STAGE}"

      - name: Upload Ubuntu release assets
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-assets
          path: |
            dist/ferrite_*_amd64.deb
            dist/ferrite-linux-x86_64.tar.gz
          if-no-files-found: error

  build-windows:
    name: Build Windows 11 Installer (.exe & .zip)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Ensure Inno Setup 6 is installed
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Candidates = @(
              (Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"),
              (Join-Path $env:ProgramFiles "Inno Setup 6\ISCC.exe")
          ) | Where-Object { Test-Path $_ }
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and $Candidates.Count -eq 0) {
              choco install innosetup -y --no-progress
              if ($LASTEXITCODE -ne 0) {
                  throw "Failed to install Inno Setup via Chocolatey"
              }
          }

      - name: Fetch libmpv-2.dll and build Windows packages
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12 -bor [Net.SecurityProtocolType]::Tls13

          $Headers = @{
              "Accept" = "application/vnd.github+json"
              "Authorization" = "Bearer $env:GITHUB_TOKEN"
              "User-Agent" = "Ferrite-Release-Builder"
          }
          $MpvRelease = Invoke-RestMethod -Uri "https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest" -Headers $Headers
          $DevAsset = $MpvRelease.assets | Where-Object { $_.name -match '^mpv-dev-x86_64-\d+.*\.7z$' -and $_.name -notmatch 'v3' } | Select-Object -First 1
          if (-not $DevAsset) {
              $DevAsset = $MpvRelease.assets | Where-Object { $_.name -match '^mpv-dev-x86_64-.*\.7z$' } | Select-Object -First 1
          }
          if (-not $DevAsset) {
              throw "Unable to locate mpv-dev-x86_64 archive in shinchiro/mpv-winbuild-cmake latest release"
          }

          $TempRoot = if ($env:RUNNER_TEMP) { $env:RUNNER_TEMP } else { [System.IO.Path]::GetTempPath() }
          $MpvTemp = Join-Path $TempRoot "mpv-dev"
          New-Item -ItemType Directory -Force -Path $MpvTemp | Out-Null
          $ArchivePath = Join-Path $MpvTemp $DevAsset.name
          Invoke-WebRequest -Uri $DevAsset.browser_download_url -OutFile $ArchivePath -UseBasicParsing

          if ($DevAsset.digest -and $DevAsset.digest.StartsWith("sha256:")) {
              $Expected = $DevAsset.digest.Substring(7).ToLowerInvariant()
              $Actual = (Get-FileHash -Path $ArchivePath -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($Actual -ne $Expected) {
                  throw "SHA-256 verification failed for $($DevAsset.name)"
              }
          }

          $ExtractDir = Join-Path $MpvTemp "extracted"
          New-Item -ItemType Directory -Force -Path $ExtractDir | Out-Null
          & 7z x $ArchivePath "-o$ExtractDir" -y | Out-Null
          $DllFile = Get-ChildItem -Path $ExtractDir -Filter "libmpv-2.dll" -Recurse | Select-Object -First 1
          if (-not $DllFile) {
              throw "libmpv-2.dll missing from extracted mpv-dev archive"
          }

          $CleanVer = $env:RELEASE_TAG.TrimStart("v", "V")
          & .\scripts\build-windows.ps1 -Version $CleanVer -MpvDllPath $DllFile.FullName

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: |
            dist/Ferrite-Setup-*-x64.exe
            dist/ferrite-windows-x86_64.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release & SHA256SUMS
    needs:
      - build-ubuntu
      - build-windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Ubuntu assets
        uses: actions/download-artifact@v4
        with:
          name: ubuntu-assets
          path: release-assets

      - name: Download Windows assets
        uses: actions/download-artifact@v4
        with:
          name: windows-assets
          path: release-assets

      - name: Generate SHA256SUMS.txt
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum ferrite_*_amd64.deb ferrite-linux-x86_64.tar.gz Ferrite-Setup-*-x64.exe ferrite-windows-x86_64.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/ferrite_*_amd64.deb
            release-assets/ferrite-linux-x86_64.tar.gz
            release-assets/Ferrite-Setup-*-x64.exe
            release-assets/ferrite-windows-x86_64.zip
            release-assets/SHA256SUMS.txt
