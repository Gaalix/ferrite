[package]
name = "stremio-core-runtime"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Tokio, Reqwest, and SQLite runtime bridge and stream metadata parser for Ferrite"

[dependencies]
stremio-core = { path = "../../vendor/stremio-core", features = ["derive", "env-future-send", "deflate"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros", "time", "fs", "net", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "deflate", "http2", "charset", "system-proxy"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
http = "1.2"
url = { version = "2.4", features = ["serde"] }
dirs = "5"
directories = "5"
regex = "1.8"
once_cell = "1"
tracing = "0.1"
thiserror = "2"
roxmltree = "0.21"
zeroize = { version = "1.9", features = ["derive"] }
data-encoding = "2.11"
hex = "0.4"
urlencoding = "2.1"
flate2 = "1"
sha2 = "0.10"
chardetng = "1.0"
encoding_rs = "0.8"

[dev-dependencies]
tempfile = "3"
