[package]
name = "stremio-stream-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Embedded BitTorrent and HTTP range streaming engine for Ferrite"

[dependencies]
stremio-core = { path = "../../vendor/stremio-core" }
librqbit = { version = "9.1", default-features = false, features = ["rust-tls"] }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
tower-http = { version = "0.6", features = ["cors"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
url = { version = "2.4", features = ["serde"] }
percent-encoding = "2"
futures = "0.3"
bytes = "1"
http = "1"
mime_guess = "2"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
parking_lot = "0.12"
data-encoding = "2.9"
tracing = "0.1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
sha1 = "0.10"
serde_bencode = "0.2"
